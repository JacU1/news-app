<div class="container-fluid main main-background">
  <div class="row h-100">
    <div class="globe" data-globe>
      <div id="markerLabel" class="hidden">
        <button id="closeButton" type="button" aria-label="Close">X</button>
        <div class="text" id="idNum"></div>
        <div class="text" id="magnitude"></div>
        <div class="text" id="coordinates"></div>
      </div>
    </div>

    <div
      class="col col-lg-3 d-flex flex-column justify-content-between bg-light main__right"
    >
      <form class="mt-5" [formGroup]="loginFormGroup">
        <div class="form-group">
          <label for="exampleInputEmail1">Email address</label>
          <input
            type="email"
            formControlName="loginName"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
            placeholder="Enter email"
          />
        </div>
        <div class="form-group">
          <label for="exampleInputPassword1">Password</label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            id="exampleInputPassword1"
            placeholder="Password"
          />
        </div>
        <div class="container d-flex flex-column mt-4">
          <button
            type="submit"
            class="btn btn-primary m-2 border-0"
            [disabled]="!loginFormGroup.valid"
            (click)="onLoginClick()"
          >
            Submit
          </button>
          <button
            type="submit"
            class="btn btn-primary m-2 border-0"
            (click)="onRegisterNewUserClick()"
          >
            Register
          </button>
        </div>
      </form>
      <div class="container m-auto text-center mt-4 mb-1">
        <p class="text-center m-0"><small>Powered By:</small></p>
        <img class="img-fluid" src="assets/logo-1-trans.svg" />
      </div>
    </div>
  </div>
</div>
